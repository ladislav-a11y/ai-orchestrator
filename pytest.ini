[pytest]
# Windows: the default pytest temp root (a numbered dir under
# %TEMP%\pytest-of-<user>, aliased by a "pytest-current" symlink) has been
# observed to fail session teardown with
#   PermissionError: [WinError 5] Pristup byl odepren: '...\pytest-current'
# even though every test itself passed - cleanup_dead_symlinks() cannot
# unlink that symlink, which pytest reports as a hard suite failure.
# An explicit --basetemp makes pytest use this single directory directly
# instead of the rotating numbered-dir/symlink scheme, avoiding that code
# path entirely. See tests/conftest.py's pytest_configure, which already
# ensures this path's parent exists.
addopts = --basetemp=.pytest-tmp
