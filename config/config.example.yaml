# Konfigurace ai-orchestrator.
#
# Tento soubor je VZOR. Při prvním spuštění se automaticky zkopíruje do
# config/config.yaml, pokud config.yaml ještě neexistuje. Uprav si rovnou
# config.yaml, ne tento vzor (ten slouží jako "tovární nastavení" pro obnovu).

# Který agent se použije, pokud úkol žádný nevybere výslovně.
default_agent: claude-code

# Kořen pracovního prostoru: hranice, mimo kterou orchestrátor (a jím řízený
# ClaudeCodeAgent) nikdy nesmí pracovat - natvrdo vynuceno v config.py, ať už
# je projekt zadaný jménem z registru níže, nebo jako syrová cesta na disku.
# Prázdné = automaticky nadřazený adresář tohoto repozitáře, tedy
# "D:/orchestrator" (protože tento projekt leží v "D:/orchestrator/ai-orchestrator").
workspace_root: ""

# Registr projektů: krátké jméno -> cesta na disku (+ volitelný testovací
# příkaz specifický pro daný projekt). Do "run" pak stačí zadat jméno
# projektu, ne celou cestu. Cesty na Windows piš buď s dvojitým zpětným
# lomítkem ("D:\\claudemail"), nebo s obyčejným lomítkem ("D:/claudemail").
# Cesta nemusí existovat předem - pokud neexistuje, orchestrátor adresář
# při prvním úkolu na tomto projektu sám založí (agent tak může založit
# úplně nový projekt od nuly). Musí ale vždy ležet uvnitř workspace_root.
projects:
  ai-orchestrator:
    path: "D:/orchestrator/ai-orchestrator"
  # station-agent:
  #   path: "D:/orchestrator/station-agent"   # zatím nemusí existovat
  #   test_command: "pytest"
  # claudemail:
  #   path: "D:/claudemail"
  #   test_command: "pytest"

# Nastavení agenta Claude Code.
claude_code:
  # Prázdné = orchestrátor si cestu k "claude" najde sám (nejdřív v PATH,
  # pak ve standardních instalačních adresářích Claude Desktop / Claude Code).
  cli_path: ""
  # Prázdné = použije se výchozí model nastavený v samotném Claude Code.
  model: ""
  # POVOLENÉ hodnoty (skutečné hodnoty CLI přepínače --permission-mode):
  # default, acceptEdits, plan, bypassPermissions.
  # NIKDY nepoužívej "bypassPermissions" - orchestrátor to i tak odmítne
  # při startu, protože je to stejné jako --dangerously-skip-permissions.
  permission_mode: acceptEdits
  # Volitelně omez, jaké nástroje smí Claude v této session použít (obecné
  # jméno nástroje, např. "Bash" nebo "Edit" - ne jednotlivé příkazy).
  # Prázdný seznam = řídí se to jen jemnějšími allow/deny pravidly níže.
  allowed_tools: []
  disallowed_tools: []
  # Jemná allow/deny pravidla na úrovni konkrétních příkazů (např.
  # "Bash(git status:*)") orchestrátor nastavuje automaticky za tebe do
  # <projekt>/.claude/settings.local.json - viz orchestrator/claude_settings.py
  # a ARCHITECTURE.md. Tady v config.yaml nejsou, protože platí per-projekt,
  # ne globálně pro agenta.
  # Tvrdý strop útraty za jeden úkol v USD. null = bez limitu (agent si
  # ale i tak hlídá běžné rozpočtové chování Claude Code).
  max_budget_usd: null
  # Po kolika sekundách bez odpovědi orchestrátor běh Claude Code ukončí.
  timeout_seconds: 1800

# Nastavení agenta Antigravity (lokální CLI "agy"). Vybere se buď jako
# default_agent výše, nebo za běhu přepínačem "--agent antigravity".
antigravity:
  # Prázdné = orchestrátor si cestu k "agy" najde sám (v PATH).
  cli_path: ""
  # Prázdné = použije se výchozí model nastavený v samotném Antigravity CLI.
  model: ""
  # Předává se jako "--mode" CLI přepínači "agy". "accept-edits" automaticky
  # schvaluje úpravy souborů, ale ostatní akce (např. shellové příkazy) i tak
  # v neinteraktivním režimu ve výchozím stavu zamítá. NIKDY sem nedávej nic,
  # co by odpovídalo "--dangerously-skip-permissions" - ten přepínač adapter
  # nikdy nepoužije bez ohledu na tuto hodnotu.
  mode: accept-edits
  # Po kolika sekundách bez odpovědi orchestrátor běh Antigravity ukončí.
  timeout_seconds: 1800

# Nastavení agenta OpenAI Codex (lokální CLI "codex"). Vybere se buď jako
# default_agent výše, nebo za běhu přepínačem "--agent codex".
codex:
  # Prázdné = orchestrátor si cestu ke "codex" najde sám (v PATH).
  cli_path: ""
  # Prázdné = použije se výchozí model nastavený v samotném Codex CLI.
  model: ""
  # Předává se jako "--sandbox" přepínači "codex exec". "workspace-write"
  # automaticky povoluje úpravy souborů uvnitř projektu, ale síťový přístup
  # a zápis mimo projekt i tak zamítá. POVOLENÉ hodnoty: "workspace-write",
  # "read-only". NIKDY sem nedávej "danger-full-access" - orchestrátor to
  # i tak odmítne při startu, protože v kombinaci s
  # --dangerously-bypass-approvals-and-sandbox (ten adapter nikdy nepoužije
  # bez ohledu na tuto hodnotu) by to znamenalo obejití sandboxu.
  sandbox_mode: workspace-write
  # Po kolika sekundách bez odpovědi orchestrátor běh Codexu ukončí.
  timeout_seconds: 1800

# Git integrace.
git:
  # Automaticky vytvořit commit po úspěšně dokončeném a otestovaném úkolu.
  # Výchozí je false - dokud si nejsi jistý, že tomu chceš důvěřovat, nech
  # to vypnuté a commituj si sám podle "git diff" výstupu z orchestrátoru.
  auto_commit: false
  commit_message_prefix: "[ai-orchestrator] "

# Testování.
testing:
  # Výchozí testovací příkaz, pokud projekt v "projects" nemá vlastní
  # test_command. Prázdné = testy se pro daný projekt přeskočí (a tím pádem
  # se rovnou přejde k commitu, pokud je auto_commit zapnutý).
  test_command: ""
  # Kolikrát se má agent pokusit kód opravit, když testy selžou, než se
  # úkol označí jako FAILED.
  max_fix_attempts: 2

# Lokální API (zatím jen pro localhost, nikdy nevystavovat do internetu).
api:
  host: "127.0.0.1"
  port: 8765

# Pracovní adresáře - relativní cesty jsou vůči kořeni projektu.
paths:
  inbox: "inbox"
  outbox: "outbox"
  logs: "logs"
  data: "data"
